[package]
name = "open-agents-gui"
version = "0.3.5"
edition = "2021"

[features]
test-support = ["gpui/test-support"]

[[bin]]
name = "open_agents"
path = "src/main.rs"

[dependencies]
dirs = "6.0"
libc = "0.2"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
image = { version = "0.25", default-features = false }
smallvec = "1"
unicode-segmentation = "1.11"
ureq = { version = "2.12", features = ["json"] }
pulldown-cmark = "0.12"

[build-dependencies]
cc = "1.2"
