[package]
name = "open-agents-gui"
version = "0.2.29"
edition = "2021"

[[bin]]
name = "open_agents"
path = "src/main.rs"

[dependencies]
dirs = "6.0"
libc = "0.2"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1.11"
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
cc = "1.2"
